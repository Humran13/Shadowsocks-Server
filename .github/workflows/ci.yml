name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # severity=warning: fail on real bugs (error/warning), not on style
          # notes like SC2034 (vars sourced across files) or SC2015 (A&&B||C
          # used intentionally as independent branches, not if/then/else).
          shellcheck -x --severity=warning -e SC2034,SC2015,SC2012,SC2017 \
            bin/shadowsocks lib/common.sh lib/uri.sh lib/firewall.sh install.sh

  unit-tests:
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq
      - name: Run unit tests
        run: bats tests/unit/validation.bats

  integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ["18.04", "20.04", "22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: |
          cat > /tmp/Dockerfile <<EOF
          FROM ubuntu:${{ matrix.ubuntu_version }}
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 dbus python3 && \
              apt-get clean && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/lib/systemd/systemd"]
          EOF
          docker build -t ss-ci-test -f /tmp/Dockerfile .

      - name: Run installer + manager + real proxy test in container
        run: |
          docker run -d --name ss-ci --privileged \
            --tmpfs /run --tmpfs /run/lock \
            -v "${{ github.workspace }}:/opt/src:ro" \
            ss-ci-test
          sleep 5
          docker exec ss-ci systemctl is-system-running --wait || true

          docker exec ss-ci bash -c '
            set -e
            cp -r /opt/src /opt/work
            sed -i "s#RAW_BASE=\"https://raw.githubusercontent.com/\${REPO}/main\"#RAW_BASE=\"file:///opt/work\"#" /opt/work/install.sh
            cd /opt/work && bash install.sh
          '

          docker exec ss-ci bash -c '
            set -e
            shadowsocks add citest 8388 chacha20-ietf-poly1305
            shadowsocks list
            shadowsocks show citest
            shadowsocks diagnostics
            ss -tlnp | grep 8388
            ss -ulnp | grep 8388
          '

          echo "--- Real TCP proxy test ---"
          docker exec ss-ci bash -c '
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dnsutils >/dev/null
            PW=$(jq -r ".users[0].password" /etc/shadowsocks-server/users.json)
            cat > /tmp/client.json <<JSON
          {"server":"127.0.0.1","server_port":8388,"password":"$PW","method":"chacha20-ietf-poly1305","local_address":"127.0.0.1","local_port":1080,"mode":"tcp_and_udp"}
          JSON
            nohup sslocal -c /tmp/client.json > /tmp/sslocal.log 2>&1 &
            sleep 2
            curl -x socks5h://127.0.0.1:1080 -fsS --max-time 8 https://api.ipify.org
          '

          echo "--- Real UDP proxy test (DNS via SOCKS5 UDP-ASSOCIATE) ---"
          docker exec ss-ci bash -c 'python3 /opt/src/tests/integration/udp_socks5_test.py'

          echo "--- Uninstall test ---"
          docker exec ss-ci bash -c 'echo 2 | shadowsocks uninstall'
          docker exec ss-ci bash -c '[[ ! -d /etc/shadowsocks-server ]] && echo "uninstall OK"'

      - name: Cleanup
        if: always()
        run: docker rm -f ss-ci 2>/dev/null || true
